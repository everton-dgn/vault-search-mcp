<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">vault-search-mcp</title>
  <desc id="description">A vault door connected to a network of notes, representing local vector, text, and graph search.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1e33"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d7f9f4" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="910" cy="180" r="210" fill="url(#glow)"/>

  <g transform="translate(92 68)">
    <rect x="0" y="0" width="224" height="224" rx="52" fill="#0c2335" stroke="#79e4d4" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="112" cy="112" r="72" fill="#071724" stroke="url(#accent)" stroke-width="8"/>
    <circle cx="112" cy="112" r="24" fill="#102b3d" stroke="#d7f9f4" stroke-width="5"/>
    <path d="M112 40v35M112 149v35M40 112h35M149 112h35M61 61l25 25M138 138l25 25M163 61l-25 25M86 138l-25 25" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="112" cy="112" r="7" fill="#5eead4" filter="url(#soft-glow)"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M346 180C430 180 448 94 532 94"/>
    <path d="M346 180C430 180 448 180 532 180"/>
    <path d="M346 180C430 180 448 266 532 266"/>
  </g>
  <g fill="#071724" stroke="#86efe0" stroke-width="3">
    <circle cx="532" cy="94" r="10"/>
    <circle cx="532" cy="180" r="10"/>
    <circle cx="532" cy="266" r="10"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="584" y="132" fill="#f1f9ff" font-size="54" font-weight="720" letter-spacing="-1.6">vault-search-mcp</text>
    <text x="586" y="180" fill="#b9d6e8" font-size="23">Local hybrid search for Markdown knowledge.</text>
    <g transform="translate(586 220)" font-size="16" font-weight="650">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#123b46" stroke="#5eead4" stroke-opacity="0.55"/>
      <text x="20" y="22" fill="#a7f3d0">VECTORS</text>
      <rect x="124" y="0" width="88" height="34" rx="17" fill="#122f4b" stroke="#60a5fa" stroke-opacity="0.55"/>
      <text x="146" y="22" fill="#bfdbfe">TEXT</text>
      <rect x="224" y="0" width="84" height="34" rx="17" fill="#242b4d" stroke="#a5b4fc" stroke-opacity="0.55"/>
      <text x="245" y="22" fill="#c7d2fe">GRAPH</text>
      <rect x="320" y="0" width="84" height="34" rx="17" fill="#25333c" stroke="#cbd5e1" stroke-opacity="0.45"/>
      <text x="341" y="22" fill="#e2e8f0">LOCAL</text>
    </g>
  </g>
</svg>
