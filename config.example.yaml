# Configuração canônica do vault-search-mcp.
#
# Copie para config.yaml e ajuste somente os campos necessários. Caminhos
# relativos são resolvidos a partir do diretório do arquivo de configuração.
# A configuração efetiva é fixada no primeiro import; reinicie MCP e daemon
# depois de alterar o arquivo. config.yaml e config.yml ficam fora do controle
# de versão por padrão.

paths:
  vault_path: "vaults/obsidian_vault"
  data_dir: "data"
  lancedb_table: "vault_chunks"

search:
  candidates: 50
  candidates_max: 500
  candidates_multiplier: 2
  top_k: 10
  top_k_min: 1
  top_k_max: 100
  score_precision: 4
  list_notes_default_limit: 500
  list_notes_max_limit: 5000

indexing:
  batch_size: 500
  workers: null
  max_chunks_per_note: 1000
  extensions:
    - ".md"
    - ".mdx"
    - ".txt"
    - ".pdf"
    - ".canvas"
  ignored_folders:
    - ".obsidian"
    - ".smart-env"
    - ".trash"
    - ".git"

fts:
  # O default neutro funciona em vaults multilíngues. Defina, por exemplo,
  # "Portuguese" ou "English" somente quando o stemming específico for desejado.
  language: null

prewarm:
  enabled: true
  max_ram_percent: 0.25
  min_available_ram: 2147483648
  bytes_per_chunk: 5120

embedding:
  model: "BAAI/bge-m3"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  # null + auto escolhem precisão e backend compatíveis em runtime.
  use_fp16: null
  device: "auto"
  batch_size: 32
  query_max_length: 512
  corpus_max_length: 1024
  dimension: 1024
  reranker_normalize: true
  idle_timeout: 1800

chunking:
  size: 2000
  overlap: 200
  header_levels: 4
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

security:
  max_query_length: 10000
  max_content_size: 10485760
  max_path_length: 500
  max_frontmatter_keys: 100

watcher:
  debounce: 2.0
  poll_factor: 2
  thread_join_timeout: 5

pdf:
  ocr_enabled: true
  ocr_languages: "por+eng"
  ocr_dpi: 150

vector_index:
  min_chunks: 5000
  auto_create: true
  index_type: "IVF_PQ"
  num_sub_vectors: 128
  distance_type: "cosine"

navigation:
  folder_tree_max_depth: 10
  folder_tree_max_depth_limit: 50

daemon:
  # Somente loopback é aceito. O protocolo HTTP interno não é público.
  host: "127.0.0.1"
  port: 9847
  timeout: 120.0
  auto_use: true
  max_request_bytes: 2097152
  max_texts: 512
  max_text_length: 100000

frontmatter:
  enabled: false
  mode: "lenient"
  allow_extra_fields: true
  ai:
    enabled: false
    allow_external_processing: false
    provider: null
    allow_defer_required_on_create: true
    # Somente {model} é aceito. O conteúdo da nota segue por stdin.
    command: []
    # Defina os identificadores aceitos pelo provider somente ao habilitar o recurso.
    primary_model: null
    fallback_model: null
    timeout_seconds: 8.0
    max_attempts: 2
    max_note_chars: 12000
  schema:
    id:
      type: "uuid"
      on_missing: "auto"
    created_at:
      type: "datetime"
      on_missing: "auto"
      aliases: ["created", "date"]
