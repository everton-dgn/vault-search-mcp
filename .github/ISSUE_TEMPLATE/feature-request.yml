name: Feature request
description: Proponha um contrato ou caso de uso verificável.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual tarefa não pode ser concluída hoje?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contrato desejado
      description: Entrada, saída e efeitos colaterais esperados.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: textarea
    id: risks
    attributes:
      label: Riscos
      description: Privacidade, compatibilidade, dados, recursos e reversão.
    validations:
      required: true
