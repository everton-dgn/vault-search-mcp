name: Feature request
description: Propose a verifiable contract or use case.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which task cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Desired contract
      description: Expected input, output, and side effects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Privacy, compatibility, data, resources, and reversibility.
    validations:
      required: true
