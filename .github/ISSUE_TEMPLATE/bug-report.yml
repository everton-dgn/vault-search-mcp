name: Bug report
description: Report a reproducible failure using synthetic data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real notes, secrets, absolute paths, or unsanitized logs.
        Report vulnerabilities privately through the channel in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, device, and daemon state.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic fixtures and queries.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
      description: Remove private content and machine-specific paths.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks performed
      description: Commands and material results.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm that this report contains no private data or credentials.
          required: true
