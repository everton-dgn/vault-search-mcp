version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "lancedb"
        # 0.30+ altera APIs usadas por indexação, busca e prewarm.
        versions: [">=0.30.0"]
      - dependency-name: "sentence-transformers"
        # Releases major exigem validar o carregamento e a inferência dos modelos.
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
