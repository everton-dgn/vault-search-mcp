version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "lancedb"
        # 0.30+ changes APIs used by indexing, search, and prewarm.
        versions: [">=0.30.0"]
      - dependency-name: "sentence-transformers"
        # Major releases require model-loading and inference validation.
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
